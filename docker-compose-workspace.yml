version: '3.8'

services:
  # 1. Experiment Tracking Layer
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: mlops_mlflow_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - AZURE_STORAGE_USE_MANAGED_IDENTITY=True
    volumes:
      - mlflow_metadata:/mlflow
    command: >
      mlflow server
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root wasbs://mlops-artifacts@mlopsdatastoragerajesh.blob.core.windows.net/
      --host 0.0.0.0
      --port 5000

  # 2. On-Demand PySpark Data Processing Workspace
  pyspark-workspace:
    image: jupyter/pyspark-notebook:spark-3.4.0
    container_name: mlops_pyspark_workspace
    restart: always
    ports:
      - "8888:8888"
    user: root
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - CHOWN_HOME=yes
    volumes:
      - ~/mlops-project:/home/jovyan/work
      - ~/dvc-cache:/home/jovyan/dvc-cache
    working_dir: /home/jovyan/work

  # 3. Airflow Orchestration Broker
  airflow-redis:
    image: redis:7.2-alpine
    container_name: mlops_airflow_redis
    restart: always
    ports:
      - "6379:6379"

  # 4. Airflow Webserver Dashboard (Orchestration Brain)
  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: mlops_airflow_webserver
    restart: always
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
    volumes:
      - ~/mlops-project/dags:/opt/airflow/dags
      - airflow_db_volume:/opt/airflow
    command: webserver

  # 5. Airflow Scheduler Engine
  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: mlops_airflow_scheduler
    restart: always
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
    volumes:
      - ~/mlops-project/dags:/opt/airflow/dags
      - airflow_db_volume:/opt/airflow
    command: scheduler
    depends_on:
      - airflow-webserver

  # 6. Real-Time Ingestion Streaming Broker (Kafka in KRaft Mode)
  kafka-broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: mlops_kafka_broker
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REREPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      # Restrict Kafka's internal Java virtual machine to 1GB RAM to protect your VM
      KAFKA_OPTS: "-Xms1024m -Xmx1024m"

  # 7. Log Analytics Database Engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    container_name: mlops_elasticsearch
    restart: always
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Caps internal Elasticsearch memory footprint to 1.5GB to safeguard VM stability
      - ES_JAVA_OPTS=-Xms1536m -Xmx1536m
    volumes:
      - elastic_data:/usr/share/elasticsearch/data

  # 8. Log Visualization Dashboard (Kibana Console)
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.18
    container_name: mlops_kibana
    restart: always
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

volumes:
  mlflow_metadata:
  airflow_db_volume:
  elastic_data:
